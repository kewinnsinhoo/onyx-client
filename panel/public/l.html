<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descargar</title>
<link rel="icon" href="/img/icon.png" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --a: #8e9bff; --a2: #5b67e8; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; font: 16px/1.55 "Instrument Sans", system-ui, sans-serif; color: #e8ebff; background: #06070d; display: flex; flex-direction: column; }
  .bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(900px 600px at 80% 0%, color-mix(in srgb, var(--a) 30%, transparent), transparent 60%), #06070d; }
  .bg.img { background: linear-gradient(180deg, rgba(6,7,13,.55), rgba(6,7,13,.92) 70%), var(--bg) center / cover no-repeat; }
  main { width: min(980px, 100% - 40px); margin: auto; padding: 64px 0 40px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; align-items: center; }
  .icon { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 20px 50px -18px var(--a); }
  .logo { max-height: 70px; max-width: 360px; object-fit: contain; display: block; }
  h1 { font: 800 clamp(36px, 5vw, 54px)/1.05 Sora, system-ui, sans-serif; letter-spacing: -.03em; margin-top: 22px; }
  .tag { font-size: 19px; color: #b9c0e6; margin-top: 12px; max-width: 30em; }
  .links { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .links a { color: #e8ebff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 11px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); }
  .links a:hover { border-color: var(--a); }
  .box { padding: 24px; border-radius: 22px; background: rgba(14,16,28,.82); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(12px); }
  .main-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: 15px; color: #fff; text-decoration: none; font-weight: 700; font-size: 17px;
    background: linear-gradient(135deg, var(--a), var(--a2)); box-shadow: 0 16px 40px -14px var(--a); }
  .main-btn small { display: block; font-weight: 500; font-size: 12.5px; opacity: .85; }
  .others { margin-top: 16px; display: grid; gap: 6px; }
  .others a { display: flex; justify-content: space-between; color: #c9cff0; text-decoration: none; font-size: 14px; padding: 9px 12px; border-radius: 10px; }
  .others a:hover { background: rgba(255,255,255,.05); }
  .others span { color: #7d85ad; }
  .ver { margin-top: 14px; font-size: 13px; color: #7d85ad; text-align: center; }
  details { margin-top: 16px; font-size: 13.5px; color: #9aa1c7; }
  summary { cursor: pointer; font-weight: 600; color: #c9cff0; }
  details p { margin-top: 8px; }
  .empty { text-align: center; color: #9aa1c7; }
  footer { text-align: center; padding: 22px; font-size: 13px; color: #6b7299; }
  footer a { color: #9aa1c7; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; gap: 28px; padding-top: 40px; } }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main id="m"><div class="empty">Cargando…</div></main>
<footer>Con la tecnología de <a href="https://onyxclient.site" rel="noopener">Onyx Client</a> · Producto no oficial de Minecraft.</footer>
<script>
(async function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const okUrl = (u) => (/^https:\/\//.test(u || '') ? u : null);
  const okColor = (c) => (/^#[0-9a-f]{6}$/i.test(c || '') ? c : null);
  const id = location.pathname.split('/').filter(Boolean)[1] || '';
  const m = document.getElementById('m');
  let data;
  try { const r = await fetch(`/api/public/brands/${encodeURIComponent(id)}/downloads`); if (!r.ok) throw 0; data = await r.json(); }
  catch { m.innerHTML = '<div class="empty"><h1 style="font-size:30px">Este launcher no existe</h1><p class="tag">Revisa el enlace que te pasaron.</p></div>'; return; }
  const b = data.brand, files = data.files || [];
  document.title = `Descargar ${b.name}`;
  if (okUrl(b.icon)) document.getElementById('fav').href = b.icon;
  if (okColor(b.accent)) document.documentElement.style.setProperty('--a', b.accent);
  document.documentElement.style.setProperty('--a2', okColor(b.accent2) || okColor(b.accent) || '#5b67e8');
  if (okUrl(b.background) && !/\.(webm|mp4)$/i.test(b.background)) { const bg = document.getElementById('bg'); bg.classList.add('img'); bg.style.setProperty('--bg', `url("${b.background.replace(/["\\]/g, '')}")`); }
  const ua = navigator.userAgent;
  const os = /Windows/i.test(ua) ? 'windows' : /Mac/i.test(ua) ? 'mac' : /Linux|X11/i.test(ua) ? 'linux' : 'windows';
  const pick = files.find(f => f.os === os) || (os === 'mac' && files.find(f => f.os === 'mac-arm')) || files.find(f => f.os === 'windows') || files[0];
  const size = (n) => (n ? (n / 1048576).toFixed(0) + ' MB' : '');
  const links = [['Discord', b.discord], ['Web', b.web], ['Tienda', b.store]].filter(x => okUrl(x[1]));
  m.innerHTML = `<div>
      ${okUrl(b.logo) ? `<img class="logo" src="${esc(b.logo)}" alt="${esc(b.name)}">` : okUrl(b.icon) ? `<img class="icon" src="${esc(b.icon)}" alt="">` : ''}
      <h1>${esc(b.name)}</h1>
      <p class="tag">${esc(b.tagline || (b.studioName ? `El launcher de ${b.studioName} para jugar sus eventos de Minecraft.` : 'Launcher de Minecraft.'))}</p>
      ${links.length ? `<div class="links">${links.map(([l, u]) => `<a href="${esc(u)}" rel="noopener" target="_blank">${l}</a>`).join('')}</div>` : ''}
    </div>
    <div class="box">${pick ? `
      <a class="main-btn" href="${esc(pick.url)}"><span>Descargar para ${esc(pick.label)}<small>${esc(size(pick.size))}</small></span></a>
      <div class="others">${files.filter(f => f !== pick).map(f => `<a href="${esc(f.url)}">${esc(f.label)}<span>${esc(size(f.size))}</span></a>`).join('')}</div>
      ${data.version ? `<p class="ver">Versión ${esc(data.version)} · se actualiza sola</p>` : ''}
      <details><summary>¿Windows dice «Windows protegió su PC»?</summary><p>Es normal en programas nuevos. Pulsa «Más información» y luego «Ejecutar de todas formas».</p></details>
      <details><summary>¿En Mac no se abre?</summary><p>Haz clic derecho en la app, elige «Abrir» y confirma. Solo hace falta la primera vez.</p></details>`
      : '<p class="empty">Todavía se está preparando. Vuelve en unos minutos.</p>'}</div>`;
})();
</script>
</body>
</html>
