<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de los servicios · Onyx</title>
<link rel="icon" href="/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script>try{var th=localStorage.getItem('onyx-theme')||'dark';if(th==='system')th=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=th}catch(e){}</script>
<style>
  .st { width: min(760px, 100% - 32px); margin: 0 auto; padding: 36px 0 60px; }
  .st header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .st header img { height: 30px; width: auto; }
  [data-theme="light"] .st header img { filter: invert(1) hue-rotate(180deg); }
  .st header a { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 14px; }
  .sum { display: flex; align-items: center; gap: 12px; padding: 20px 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); margin-bottom: 18px; }
  .sum .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
  .sum .ic svg { width: 18px; height: 18px; }
  .sum h1 { font-size: 22px; }
  .svc { padding: 18px 20px; border-top: 1px solid var(--line); }
  .svc:first-child { border-top: 0; }
  .svc .top2 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .svc b { color: var(--text); }
  .svc .up { margin-left: auto; font-size: 13px; font-weight: 600; }
  .bars { display: grid; grid-template-columns: repeat(90, 1fr); gap: 2px; height: 30px; }
  .bars i { border-radius: 2px; background: var(--card-2); }
  .bars i.ok { background: #22c38a; } .bars i.part { background: #f5b74a; } .bars i.bad { background: #ef5a6f; }
  .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 6px; }
  .foot { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 20px; }
</style>
</head>
<body>
<div class="st">
  <header><img src="/img/logo-wordmark.png" alt="Onyx Client"><a href="https://onyxclient.site" data-t>Ir a la web</a></header>
  <div id="app"><div class="skel" style="height:80px;margin-bottom:18px"></div><div class="skel" style="height:360px"></div></div>
  <p class="foot" id="foot"></p>
</div>
<script src="/js/i18n.js"></script>
<script>
(function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ok = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const bad = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.textContent); });
  async function load() {
    let s;
    try { s = await (await fetch('/api/public/status')).json(); } catch { document.getElementById('app').innerHTML = `<div class="sum"><h1>${t('No se pudo consultar el estado')}</h1></div>`; return; }
    const any = s.services.some(x => x.up !== null);
    document.getElementById('app').innerHTML = `
      <div class="sum"><span class="ic" style="background:${!any ? '#8a90b2' : s.allUp ? '#22c38a' : '#ef5a6f'}">${s.allUp ? ok : bad}</span>
        <h1>${!any ? t('Comprobando los servicios…') : s.allUp ? t('Todos los servicios funcionan') : t('Hay servicios con problemas')}</h1></div>
      <div class="card" style="padding:0">${s.services.map(x => `<div class="svc"><div class="top2"><b>${esc(t(x.name))}</b>
          <span class="up" style="color:${x.up === false ? 'var(--bad)' : x.up ? 'var(--ok)' : 'var(--muted)'}">${x.up === false ? t('Con problemas') : x.up ? t('Funciona') : t('Sin datos')}</span></div>
        <div class="bars">${x.days.map(d => `<i class="${!d.checks ? '' : !d.fails ? 'ok' : d.fails < d.checks / 2 ? 'part' : 'bad'}" title="${new Date(d.day).toLocaleDateString(I18N.locale())}${d.checks ? ' · ' + Math.round(100 - d.fails / d.checks * 100) + '%' : ''}"></i>`).join('')}</div>
        <div class="legend"><span>${t('Hace 90 días')}</span><span>${x.uptime == null ? '' : t('{n}% de tiempo funcionando', { n: x.uptime })}</span><span>${t('Hoy')}</span></div></div>`).join('')}</div>`;
    document.getElementById('foot').textContent = t('Se comprueba cada 5 minutos. Última actualización: {d}', { d: new Date(s.checkedAt).toLocaleTimeString(I18N.locale()) });
  }
  load(); setInterval(load, 60000);
})();
</script>
</body>
</html>
