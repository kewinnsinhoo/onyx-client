# Compila Onyx Client para Windows, macOS y Linux y lo publica en "Releases".
# Cómo usarlo: pestaña "Actions" → "Publicar nueva versión" → botón "Run workflow".
# (Antes, sube el número de "version" en package.json, por ejemplo 1.0.0 → 1.0.1)
name: Publicar nueva versión

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Crear borrador de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          if gh release view "$V" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            echo "Ya hay un borrador de $V: se reutiliza." && exit 0
          elif gh release view "$V" >/dev/null 2>&1; then
            echo "La release $V ya está publicada. Sube la versión en package.json." && exit 1
          fi
          gh release create "$V" --draft --target "${{ github.sha }}" --title "Onyx Client $V" --notes "Versión $V de Onyx Client."

  compilar:
    needs: preparar
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar repositorio
        run: node scripts/prepare-ci.js
      - name: Instalar dependencias
        run: npm install
      - name: Pruebas
        run: npm test
      - name: Compilar y subir
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  publicar:
    # Publica aunque falle Mac (a veces GitHub no tiene equipos Mac libres), siempre que exista el .exe
    needs: [preparar, compilar]
    if: always() && needs.preparar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="v${{ needs.preparar.outputs.version }}"
          if ! gh release view "$V" --json assets --jq '.assets[].name' | grep -q '\.exe$'; then
            echo "No se generó el instalador de Windows: no se publica." && exit 1
          fi
          if [[ "$V" == *-* ]]; then
            gh release edit "$V" --draft=false --prerelease
          else
            gh release edit "$V" --draft=false --latest
          fi
