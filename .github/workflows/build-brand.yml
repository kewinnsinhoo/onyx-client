# Fabrica el launcher propio de un studio (su nombre, su icono, sus colores) a partir de este
# mismo código y lo publica en la release `brand-<id>` de ESTE repo, de donde también se actualiza.
#
# Lo lanza el panel (Launchers → Compilar) o «Publicar nueva versión» con la opción de marcas.
# La ficha de la marca (nombre, icono, colores...) es pública: la sirve el panel.
#
# Las releases de marca son "prerelease" y nunca "latest": así Kopi Client nunca se confunde
# y se actualiza a un launcher de marca.
name: Launcher de marca
run-name: Marca ${{ inputs.brand }}

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Id de la marca'
        required: true
      ref:
        description: 'Rama, tag o commit de este repo'
        default: 'main'
      platforms:
        description: 'windows,linux,macos'
        default: 'windows,linux,macos'

permissions:
  contents: read

concurrency:
  group: brand-${{ inputs.brand }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PANEL: https://panel.onyxclient.site
  BRAND: ${{ inputs.brand }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      version: ${{ steps.src.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Marca
        run: |
          set -euo pipefail
          [[ "$BRAND" =~ ^[a-z][a-z0-9-]{1,31}$ ]] || { echo "::error::Id de marca no válido"; exit 1; }
          curl -fsS "$PANEL/api/public/brands/$BRAND/build" > brand.json || { echo "::error::El panel no tiene esta marca o no está permitida"; exit 1; }
          jq -e '.brand.id and .brand.name' brand.json > /dev/null
          echo "Fabricando: $(jq -r .brand.name brand.json)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src

      - name: Versión
        id: src
        run: |
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Versión propia de cada fabricación: Kopi 1.8.8 → 1.8.8001, 1.8.8002… (cada recompilación es «más nueva»
          # y los launchers instalados se actualizan solos). La siguiente de Kopi (1.8.9 → 1.8.9xxx) sigue siendo mayor.
          BASE=$(node -p "require('./src/package.json').version")
          V=$(node -e "const [M,m,p]=process.argv[1].split('-')[0].split('.').map(Number); console.log(M+'.'+m+'.'+(p*1000+(Number(process.argv[2])%1000)))" "$BASE" "$GITHUB_RUN_NUMBER")
          echo "Versión de Kopi $BASE → versión del launcher $V"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Release de la marca (se crea si no existe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="brand-$BRAND"
          NAME=$(jq -r .brand.name brand.json)
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$(git -C src rev-parse HEAD)" \
              --title "$NAME" --notes "Instaladores de $NAME (con la tecnología de Kopi Client)." > /dev/null
          fi

      - id: matrix
        env:
          P: ${{ inputs.platforms }}
        run: |
          OS=()
          [[ "$P" == *windows* ]] && OS+=('"windows-latest"')
          [[ "$P" == *linux* ]] && OS+=('"ubuntu-latest"')
          [[ "$P" == *macos* ]] && OS+=('"macos-latest"')
          [ ${#OS[@]} -gt 0 ] || { echo "::error::Sin plataformas"; exit 1; }
          echo "matrix={\"os\":[$(IFS=,; echo "${OS[*]}")]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar la marca
        env:
          RELEASES_REPO: ${{ github.repository }}
          BRAND_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/brand.js "$PANEL/api/public/brands/$BRAND/build"
      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ARGS=""; [ "$RUNNER_OS" = macOS ] && ARGS="--mac"
          npx electron-builder $ARGS --publish never
      - name: Subir a la release brand-${{ inputs.brand }}
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BIN=( *.exe *.exe.blockmap *.dmg *.dmg.blockmap *.zip *.zip.blockmap *.AppImage )
          YML=( latest*.yml )
          [ ${#BIN[@]} -gt 0 ] || { echo "::error::No salió ningún instalador"; exit 1; }
          # Primero los instaladores y después latest*.yml: nadie ve una actualización sin su archivo
          gh release upload "brand-$BRAND" "${BIN[@]}" -R "$GITHUB_REPOSITORY" --clobber
          [ ${#YML[@]} -eq 0 ] || gh release upload "brand-$BRAND" "${YML[@]}" -R "$GITHUB_REPOSITORY" --clobber
          printf '%s\n' "${BIN[@]}" "${YML[@]}"

  clean:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Quitar instaladores de versiones anteriores
        run: |
          gh release view "brand-$BRAND" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r f; do
            case "$f" in latest*.yml|*"$V"*) ;; *) gh release delete-asset "brand-$BRAND" "$f" -R "$GITHUB_REPOSITORY" -y > /dev/null && echo "Quitado $f" ;; esac
          done
