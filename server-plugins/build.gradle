// Plugins de servidor de Kopi:
// - Kopi Skins (paper, velocity, bungee): la parte común (common/src) se compila dentro de cada uno.
// - KopiGuard (guard): el anticheat del servidor. Sus cuentas (core) se prueban sin servidor: gradle :guard:check
subprojects {
    apply plugin: 'java'
    group = 'site.onyxclient'
    version = name == 'guard' ? '1.0.0' : '1.0.1'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }

    if (name != 'guard') sourceSets.main.java.srcDirs += rootProject.file('common/src')

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
    }

    processResources {
        filesMatching(['plugin.yml', 'bungee.yml']) { expand(version: project.version) }
    }

    jar {
        archiveFileName = project.name == 'guard' ? "KopiGuard-${project.version}.jar" : "KopiSkins-${project.name.capitalize()}-${project.version}.jar"
    }
}

project(':guard') {
    dependencies { compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT' }
    // Las pruebas de las cuentas (vuelo, velocidad, alcance, clics…): un main sin librerías
    tasks.register('engineTest', JavaExec) {
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'site.onyxclient.kopiguard.core.EngineTest'
    }
    check.dependsOn 'engineTest'
}

project(':paper') {
    dependencies { compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT' }
}

project(':velocity') {
    tasks.withType(JavaCompile).configureEach { options.release = 17 }
    dependencies {
        compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
        annotationProcessor 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    }
}

project(':bungee') {
    dependencies { compileOnly 'net.md-5:bungeecord-api:1.20-R0.2' }
}
